<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART FARM FINANCE AI</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
}

header{
    background:#14532d;
    padding:15px;
    text-align:center;
    font-weight:bold;
}

.container{
    padding:10px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:10px;
}

.card{
    background:#111827;
    padding:12px;
    border-radius:10px;
}

input,select,button{
    width:100%;
    padding:8px;
    margin-top:5px;
}

button{
    background:#22c55e;
    border:0;
    color:white;
}

.ai{
    color:#38bdf8;
    font-weight:bold;
}
</style>
</head>

<body>

<header>🌱 SMART FARM FINANCE AI</header>

<div class="container">

<!-- INPUT -->
<div class="card">
<h3>เพิ่มรายการ</h3>

<select id="type">
<option value="income">รายรับ</option>
<option value="expense">รายจ่าย</option>
</select>

<input id="amount" type="number" placeholder="จำนวนเงิน">
<input id="note" placeholder="หมายเหตุ">

<button onclick="add()">บันทึก</button>
</div>

<!-- SUMMARY -->
<div class="card">
<h3>สรุป</h3>
<div>รายรับ: <span id="income">0</span></div>
<div>รายจ่าย: <span id="expense">0</span></div>
<div>คงเหลือ: <span id="balance">0</span></div>
</div>

<!-- AI -->
<div class="card">
<h3>🤖 AI วิเคราะห์</h3>
<div id="ai" class="ai">-</div>
</div>

<!-- LIST -->
<div class="card">
<h3>รายการ</h3>
<div id="list"></div>
</div>

</div>

<script>

// ================= FIREBASE =================
const firebaseConfig = {
  databaseURL: "https://smart-farm-platfor-default-rtdb.asia-southeast1.firebasedatabase.app"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ================= ADD =================
function add(){

    const type = document.getElementById("type").value;
    const amount = Number(document.getElementById("amount").value);
    const note = document.getElementById("note").value;

    if(!amount) return;

    const id = Date.now();

    db.ref("finance/" + id).set({
        id,
        type,
        amount,
        note,
        time: Date.now()
    });

    document.getElementById("amount").value = "";
    document.getElementById("note").value = "";
}

// ================= AI =================
function financeAI(income, expense){

    let balance = income - expense;

    if(balance < 0){
        return "⚠️ ขาดทุน ควรลดรายจ่าย";
    }
    if(balance < 500){
        return "⚠️ กำไรต่ำ ควบคุมต้นทุน";
    }
    return "✅ สถานะฟาร์มดี";
}

// ================= REALTIME =================
db.ref("finance").on("value", snap => {

    const data = snap.val() || {};

    let income = 0;
    let expense = 0;
    let html = "";

    Object.values(data).forEach(d => {

        if(d.type === "income") income += d.amount;
        if(d.type === "expense") expense += d.amount;

        html += `
        <div>
        ${d.type} | ${d.amount} | ${d.note || "-"}
        </div>`;
    });

    let balance = income - expense;

    document.getElementById("income").innerText = income;
    document.getElementById("expense").innerText = expense;
    document.getElementById("balance").innerText = balance;

    document.getElementById("ai").innerText = financeAI(income, expense);

    document.getElementById("list").innerHTML = html;
});

</script>

</body>
</html>
